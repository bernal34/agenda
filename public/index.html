<!DOCTYPE html>
<!--
  Template HTML de la web (output SPA, el default de Expo).
  `expo start --web` y `expo export --platform web` leen este archivo:
  sustituyen el placeholder del título (nombre de app.json) e inyectan los
  scripts al cierre del body. app/+html.tsx NO aplica en SPA.
  OJO: Expo reemplaza solo la PRIMERA aparición de cada marcador, así que
  nunca escribas en comentarios el placeholder ni las etiquetas de cierre
  de head/body.
-->
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#534AB7" />
    <meta name="application-name" content="Mi Agenda" />

    <!-- iOS / Safari: agregar a pantalla de inicio (requisito para push en iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mi Agenda" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Inter, tipografía base del design system unificado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Reset recomendado por react-native-web + estilos base (equivalente al index.css de RH) -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.25);
        border-radius: 6px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.45);
        background-clip: padding-box;
      }
    </style>

    <!-- Service worker: PWA instalable + Web Push. Solo en HTTPS o localhost. -->
    <script>
      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (e) {
            console.warn('SW registration failed:', e);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>Necesitas habilitar JavaScript para usar Mi Agenda.</noscript>
    <div id="root"></div>
  </body>
</html>
